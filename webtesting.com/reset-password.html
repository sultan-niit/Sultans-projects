<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images\icon-images\icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <script src="JS/validator.js"></script>
    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
    <title>NIITITCORE | Reset Password</title>
</head>

<body>
       <div class="alert-overlay" id="alert"></div>

    <section class="auth-section">
        <div class="auth-background">
            <div class="overlay-bg">
                <div class="form-container">
                    <div class="form-content">
                        <div class="inner-form">
                            <div class="top-container">
                                <h2>Reset Password</h2>

                                <div class="icon-container">
                                    <div class="icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                            <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/>
                                        </svg>
                                    </div>
                                    <div class="icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                            <path d="M5.026 15c6.038 0 9.341-5.003 9.341-9.334q.002-.211-.006-.422A6.7 6.7 0 0 0 16 3.542a6.7 6.7 0 0 1-1.889.518 3.3 3.3 0 0 0 1.447-1.817 6.5 6.5 0 0 1-2.087.793A3.286 3.286 0 0 0 7.875 6.03a9.32 9.32 0 0 1-6.767-3.429 3.29 3.29 0 0 0 1.018 4.382A3.3 3.3 0 0 1 .64 6.575v.045a3.29 3.29 0 0 0 2.632 3.218 3.2 3.2 0 0 1-.865.115 3 3 0 0 1-.614-.057 3.28 3.28 0 0 0 3.067 2.277A6.6 6.6 0 0 1 .78 13.58a6 6 0 0 1-.78-.045A9.34 9.34 0 0 0 5.026 15"/>
                                        </svg>
                                    </div>
                                </div>

                            </div>

                            <div class="alert-success">
                                👋 <span class="alert-highlight">Sultan</span>, an OTP has been sent to your <span
                                    class="alert-highlight">email address</span> to reset your
                                password.
                            </div>

                            <div class="input-container">
                                <div class="input-wrapper">
                                    <label>OTP: <span>*</span></label>
                                    <input type="text" class="text-field" id="otp" inputmode="numeric"
                                        autocomplete="one-time-code" placeholder="Enter OTP" data-type="otp">
                                    <span class="error-text" hidden></span>
                                </div>

                                <div class="input-wrapper">
                                    <label>NEW PASSWORD: <span>*</span></label>
                                    <input type="password" class="text-field" id="newPassword"
                                        placeholder="Enter new password" data-type="password">
                                    <span class="error-text" hidden></span>
                                </div>

                                <div class="alert-warning">
                                    <i>At least 8 characters required including upper & lower cases and special
                                        characters and numbers.</i>
                                </div>

                                <div class="input-wrapper">
                                    <label>CONFIRMED PASSWORD: <span>*</span></label>
                                    <input type="password" class="text-field" id="confirmedPassword"
                                        placeholder="Enter Confirmed password" data-type="confirm-password" data-match="newPassword">
                                    <span class="error-text" hidden></span>
                                </div>

                                <button class="btn" type="button" title="Submit" id="submitBtnId"
                                    onclick="resetPasswordHandle()">Submit</button>
                            </div>


                        </div>
                    </div>
                    <div class="form-content text-content">
                        <div class="text-wrapper">
                            <div class="logo-container">
                                <img src="all-images/icon-images/niit-logo.png" alt="NIIT logo">
                            </div>
                            <div class="title">
                                <h1>Welcome to Student Portal</h1>
                                <p>Already have an account?</p>
                            </div>

                            <a href="sign-in.html">

                                <button class="btn" title="Sign In">Sign In</button>
                            </a>

                        </div>

                    </div>

                </div>


            </div>


        </div>
    </section>

    <script src="JS/validator.js"></script>
</body>

</html>
