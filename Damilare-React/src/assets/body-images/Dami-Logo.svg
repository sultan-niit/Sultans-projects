<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="platformEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfe6f0"/>
      <stop offset="100%" stop-color="#c9d5e6"/>
    </linearGradient>
    
    <!-- Screen Gradients -->
    <linearGradient id="blueScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141852"/>
      <stop offset="100%" stop-color="#0a0c2e"/>
    </linearGradient>
    <linearGradient id="pinkScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a185b"/>
      <stop offset="100%" stop-color="#4d0c35"/>
    </linearGradient>

    <!-- Glow Orange Box -->
    <linearGradient id="orangeBoxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa34d"/>
      <stop offset="100%" stop-color="#ff7b24"/>
    </linearGradient>
    <linearGradient id="orangeBoxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f56814"/>
      <stop offset="100%" stop-color="#d94f00"/>
    </linearGradient>
    <linearGradient id="orangeBoxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8533"/>
      <stop offset="100%" stop-color="#fa6200"/>
    </linearGradient>

    <!-- Glowing Network / Energy Beam -->
    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa66" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5533" stop-opacity="0.3"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#8d99ae" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- BACKGROUND SUBTLE GRID ACCENTS -->
  <g stroke="#f0f3f8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6">
    <path d="M50 300 L250 420 L550 250 L350 130 Z" fill="none"/>
    <path d="M150 180 L450 350" fill="none"/>
    <path d="M250 100 L550 280" fill="none"/>
  </g>

  <!-- MAIN ISOMETRIC PLATFORM -->
  <g filter="url(#softShadow)">
    <!-- Base Platform Bottom -->
    <path d="M300 480 L520 350 L520 365 L300 495 Z" fill="#b0c0d6"/>
    <path d="M80 350 L300 480 L300 495 L80 365 Z" fill="#9cb0ca"/>
    <!-- Base Platform Surface -->
    <path d="M300 480 L520 350 L300 225 L80 350 Z" fill="url(#platformGrad)"/>
    <!-- Platform Trim Highlight -->
    <path d="M80 350 L300 480 L520 350" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- SECONDARY PLATFORM (Top Left) -->
  <g filter="url(#softShadow)">
    <path d="M150 290 L260 225 L260 238 L150 303 Z" fill="#b0c0d6"/>
    <path d="M40 225 L150 290 L150 303 L40 238 Z" fill="#9cb0ca"/>
    <path d="M150 290 L260 225 L150 160 L40 225 Z" fill="url(#platformGrad)"/>
  </g>

  <!-- SECONDARY PLATFORM (Right) -->
  <g filter="url(#softShadow)">
    <path d="M480 370 L600 300 L600 312 L480 382 Z" fill="#b0c0d6"/>
    <path d="M360 300 L480 370 L480 382 L360 312 Z" fill="#9cb0ca"/>
    <path d="M480 370 L600 300 L480 230 L360 300 Z" fill="url(#platformGrad)"/>
  </g>

  <!-- CONVEYOR BELT / PRODUCTION LINE -->
  <g>
    <!-- Conveyor Ramp/Body -->
    <path d="M180 430 L380 315 L430 345 L230 460 Z" fill="#e2e8f0"/>
    <path d="M180 430 L230 460 L230 472 L180 442 Z" fill="#cbd5e1"/>
    <path d="M230 460 L430 345 L430 357 L230 472 Z" fill="#94a3b8"/>
    <!-- Conveyor Tracks -->
    <path d="M210 435 L395 330" stroke="#f1f5f9" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M200 442 L385 337" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- CENTRAL TECH HUB / PROCESSING MACHINE -->
  <g filter="url(#softShadow)">
    <!-- Main Cube Machine -->
    <path d="M350 310 L440 260 L440 180 L350 230 Z" fill="#e6edf7"/>
    <path d="M260 260 L350 310 L350 230 L260 180 Z" fill="#ffffff"/>
    <path d="M350 230 L440 180 L350 130 L260 180 Z" fill="#f8fafc"/>
    <!-- Glass Chamber Window -->
    <path d="M315 250 L385 210 L385 155 L315 195 Z" fill="url(#glowGlow)" opacity="0.85"/>
    <path d="M315 250 L385 210" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Glowing Network Nodes Inside Chamber -->
    <line x1="330" y1="210" x2="360" y2="180" stroke="#ff7733" stroke-width="2"/>
    <line x1="360" y1="180" x2="370" y2="200" stroke="#ff5500" stroke-width="2"/>
    <circle cx="330" cy="210" r="4" fill="#ffffff" stroke="#ff5500" stroke-width="2"/>
    <circle cx="360" cy="180" r="5" fill="#ffffff" stroke="#ff7733" stroke-width="2"/>
    <circle cx="370" cy="200" r="4" fill="#ffffff" stroke="#ff3300" stroke-width="2"/>

    <!-- Machine Output Portal -->
    <path d="M280 260 L330 290 L330 270 L280 240 Z" fill="#ff7a1a"/>
  </g>

  <!-- CONVEYOR CUBES (GLOWING ORANGE/PEACH) -->
  <!-- Cube 1 (Lower) -->
  <g>
    <path d="M230 425 L245 415 L245 428 L230 438 Z" fill="url(#orangeBoxRight)"/>
    <path d="M215 415 L230 425 L230 438 L215 428 Z" fill="url(#orangeBoxLeft)"/>
    <path d="M230 425 L245 415 L230 405 L215 415 Z" fill="url(#orangeBoxTop)"/>
  </g>
  <!-- Cube 2 (Mid Conveyor) -->
  <g>
    <path d="M275 390 L290 380 L290 393 L275 403 Z" fill="url(#orangeBoxRight)"/>
    <path d="M260 380 L275 390 L275 403 L260 393 Z" fill="url(#orangeBoxLeft)"/>
    <path d="M275 390 L290 380 L275 370 L260 380 Z" fill="url(#orangeBoxTop)"/>
  </g>
  <!-- Cube 3 (Exiting machine) -->
  <g>
    <path d="M320 355 L335 345 L335 358 L320 368 Z" fill="url(#orangeBoxRight)"/>
    <path d="M305 345 L320 355 L320 368 L305 358 Z" fill="url(#orangeBoxLeft)"/>
    <path d="M320 355 L335 345 L320 335 L305 345 Z" fill="url(#orangeBoxTop)"/>
  </g>

  <!-- DATA DASHBOARD SCREEN 1 (Left Screen) -->
  <g filter="url(#softShadow)">
    <!-- Stand -->
    <path d="M145 250 L155 245 L155 235 L145 240 Z" fill="#94a3b8"/>
    <!-- Display Back & Bezel -->
    <path d="M100 230 L200 170 L200 120 L100 180 Z" fill="#1e293b"/>
    <!-- Display Screen -->
    <path d="M104 226 L196 172 L196 126 L104 180 Z" fill="url(#blueScreenGrad)"/>
    <!-- Screen Data Graphics -->
    <!-- Circular gauge -->
    <ellipse cx="130" cy="188" rx="14" ry="10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="20 10"/>
    <ellipse cx="130" cy="188" rx="8" ry="6" fill="#f43f5e"/>
    <!-- Data wave line -->
    <path d="M150 165 Q165 150 175 160 T192 145" fill="none" stroke="#fb923c" stroke-width="2"/>
    <!-- Matrix dots -->
    <circle cx="160" cy="175" r="1.5" fill="#38bdf8"/>
    <circle cx="170" cy="170" r="1.5" fill="#38bdf8"/>
    <circle cx="180" cy="165" r="1.5" fill="#38bdf8"/>
    <circle cx="165" cy="182" r="1.5" fill="#a855f7"/>
    <circle cx="175" cy="177" r="1.5" fill="#a855f7"/>
    <circle cx="185" cy="172" r="1.5" fill="#a855f7"/>
  </g>

  <!-- DATA DASHBOARD SCREEN 2 (Right Screen) -->
  <g filter="url(#softShadow)">
    <path d="M520 280 L560 255 L560 215 L520 240 Z" fill="#e2e8f0"/>
    <path d="M480 255 L520 280 L520 240 L480 215 Z" fill="#cbd5e1"/>
    <!-- Screen -->
    <path d="M485 250 L515 268 L515 210 L485 192 Z" fill="url(#pinkScreenGrad)"/>
    <!-- Bar charts -->
    <rect x="490" y="215" width="4" height="20" fill="#f43f5e" transform="skewY(30)"/>
    <rect x="496" y="210" width="4" height="28" fill="#fb923c" transform="skewY(30)"/>
    <rect x="502" y="205" width="4" height="35" fill="#facc15" transform="skewY(30)"/>
  </g>

  <!-- DATA DASHBOARD SCREEN 3 (Desk Monitor for Sitting Worker) -->
  <g filter="url(#softShadow)">
    <path d="M375 365 L415 340 L415 310 L375 335 Z" fill="#1e293b"/>
    <path d="M377 362 L413 341 L413 313 L377 334 Z" fill="url(#blueScreenGrad)"/>
    <!-- Vertical audio/data bars -->
    <path d="M385 340 L385 330" stroke="#f43f5e" stroke-width="2"/>
    <path d="M392 342 L392 325" stroke="#f43f5e" stroke-width="2"/>
    <path d="M399 337 L399 328" stroke="#fb923c" stroke-width="2"/>
    <path d="M406 332 L406 322" stroke="#38bdf8" stroke-width="2"/>
    <!-- Desk stand -->
    <path d="M360 405 L420 370 L400 360 L340 395 Z" fill="#ffffff"/>
    <path d="M360 405 L420 370 L420 377 L360 412 Z" fill="#cbd5e1"/>
  </g>

  <!-- CONNECTING GLOWING CABLES -->
  <g fill="none" stroke-width="2">
    <!-- Orange Cable from Center Machine to Right -->
    <path d="M420 340 Q470 380 500 350" stroke="#ff7733" opacity="0.8"/>
    <!-- Pink Cable to right station -->
    <path d="M430 335 Q490 390 530 340" stroke="#ec4899" opacity="0.7"/>
    <!-- Cyan Cable to left station -->
    <path d="M270 270 Q210 320 180 290" stroke="#38bdf8" opacity="0.8"/>
  </g>

  <!-- CHARACTERS (ISOMETRIC FIGURES) -->

  <!-- 1. LEFT SCIENTIST / ENGINEER (In Lab Coat/Blue Uniform) -->
  <g>
    <!-- Head -->
    <circle cx="102" cy="178" r="6" fill="#1e293b"/>
    <ellipse cx="103" cy="180" rx="4" ry="5" fill="#fbcfe8"/>
    <!-- Glasses -->
    <rect x="99" y="179" width="3" height="2" fill="#38bdf8"/>
    <!-- Body / Coat -->
    <path d="M98 185 L106 185 L108 215 L95 215 Z" fill="#3b82f6"/>
    <path d="M100 185 L104 185 L104 220 L100 220 Z" fill="#ffffff"/>
    <!-- Legs -->
    <path d="M97 215 L101 215 L100 235 L96 235 Z" fill="#1e293b"/>
    <path d="M103 215 L107 215 L107 235 L103 235 Z" fill="#1e293b"/>
    <!-- Arm (Taking notes / pointing) -->
    <path d="M106 188 L114 195 L112 205" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 2. WORKER LIFTING CUBE (Center near conveyor) -->
  <g>
    <!-- Shadow -->
    <ellipse cx="275" cy="345" rx="8" ry="4" fill="#cbd5e1"/>
    <!-- Legs -->
    <path d="M272 328 L275 328 L273 344 L270 344 Z" fill="#1e293b"/>
    <path d="M278 328 L281 328 L280 344 L277 344 Z" fill="#1e293b"/>
    <!-- Torso -->
    <path d="M270 310 L282 310 L280 328 L271 328 Z" fill="#1e293b"/>
    <!-- Head & Hair -->
    <circle cx="276" cy="303" r="5" fill="#0f172a"/>
    <ellipse cx="277" cy="304" rx="4" ry="4" fill="#fed7aa"/>
    <!-- Arms holding glowing orange cube -->
    <path d="M273 313 L285 320" stroke="#fed7aa" stroke-width="3" fill="none"/>
    <!-- Small box in hand -->
    <path d="M285 320 L295 314 L295 322 L285 328 Z" fill="#fb923c"/>
    <path d="M280 314 L285 320 L285 328 L280 322 Z" fill="#ea580c"/>
    <path d="M285 320 L295 314 L290 308 L280 314 Z" fill="#fdba74"/>
  </g>

  <!-- 3. OPERATOR AT DESK (Sitting behind monitor) -->
  <g>
    <!-- Chair -->
    <path d="M390 415 L405 405 L405 425 L390 435 Z" fill="#94a3b8"/>
    <!-- Legs -->
    <path d="M380 410 L395 400 L395 425 L380 435 Z" fill="#1e293b"/>
    <!-- Body -->
    <path d="M385 378 L395 372 L395 400 L385 406 Z" fill="#2563eb"/>
    <!-- Head -->
    <circle cx="390" cy="368" r="6" fill="#0f172a"/>
    <!-- Arms typing on keyboard -->
    <path d="M385 385 L375 392 L368 390" stroke="#fed7aa" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 4. RIGHT WORKER WITH ORANGE SHIRT AT COMPUTER -->
  <g>
    <!-- Shadow -->
    <ellipse cx="445" cy="318" rx="8" ry="4" fill="#cbd5e1"/>
    <!-- Head -->
    <circle cx="445" cy="275" r="5" fill="#0f172a"/>
    <ellipse cx="446" cy="276" rx="4" ry="4" fill="#fed7aa"/>
    <!-- Orange shirt -->
    <path d="M440 282 L450 282 L448 302 L441 302 Z" fill="#ea580c"/>
    <!-- Dark Pants -->
    <path d="M441 302 L445 302 L444 317 L440 317 Z" fill="#1e293b"/>
    <path d="M446 302 L450 302 L449 317 L445 317 Z" fill="#1e293b"/>
    <!-- Arm interacting with interface -->
    <path d="M442 286 L435 292 L430 290" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 5. WORKER AT FAR RIGHT STATION -->
  <g>
    <!-- Legs -->
    <path d="M532 308 L537 308 L536 328 L531 328 Z" fill="#1e293b"/>
    <path d="M538 308 L543 308 L542 328 L537 328 Z" fill="#1e293b"/>
    <!-- Blue Torso -->
    <path d="M532 288 L543 288 L541 308 L532 308 Z" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="538" cy="281" r="5" fill="#0f172a"/>
    <ellipse cx="538" cy="282" rx="4" ry="4" fill="#fed7aa"/>
    <!-- Arm -->
    <path d="M532 292 L524 298" stroke="#3b82f6" stroke-width="3" fill="none"/>
  </g>
</svg>
