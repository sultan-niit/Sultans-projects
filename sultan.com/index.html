<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link
      href="all-images/icon-images/icon-image.jpeg"
      rel="shortcut icon"
      type="image-png"
    />
    <link
      href="styles/icons-1.11.3/font/bootstrap-icons.css"
      type="text/css"
      rel="stylesheet"
    />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>MICKEY | Sign in</title>
  </head>
  <body>
    <section class="auth-section">
      <div class="auth-page-background">
        <div class="auth-overlay">
          <div class="log-container">
            <div class="login-container">
              <h1 class="top-text">Login</h1>

              <form>
                <div class="form-group">
                  <input type="email" placeholder="Enter Email" required />
                </div>

                <div class="form-group">
                  <input
                    type="password"
                    placeholder="Enter Password"
                    required
                  />
                </div>

                <a href="forgot-password.html" class="forgot-password"
                  >Forgot Password ?</a
                >

                <button type="submit" class="btn btn-login">Log in</button>
              </form>

              <div class="separator">OR</div>

              <a href="#" class="btn btn-social btn-facebook">
                <span class="btn-icon"><i class="bi bi-facebook"></i></span>
                Continue with Facebook
              </a>

              <a href="#" class="btn btn-social btn-google">
                <span class="btn-icon"><i class="bi bi-google"></i></span>
                Continue with Google
              </a>

              <p class="footer-text">
                Not on Mickey yet? <a href="register.html">Sign up</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
